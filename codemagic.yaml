workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Extract and Setup Wrapper
        script: |
          # 1. فك ضغط الملف
          unzip -o lister-engine-simulator.zip
          
          # 2. تحديد مجلد المشروع الأساسي
          PROJECT_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          
          # 3. إجبار Gradle على استخدام نسخة مستقرة وتوليد gradlew
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          
          # 4. تشغيل البناء عبر الـ Wrapper الجديد
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
