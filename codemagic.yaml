workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Extract zip and build
        script: |
          # 1. فك الضغط
          unzip -o lister-engine-simulator.zip
          
          # 2. توليد wrapper ومنحه الصلاحيات
          gradle wrapper
          chmod +x gradlew
          
          # 3. تشغيل البناء
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
