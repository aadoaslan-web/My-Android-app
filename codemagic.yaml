workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Extract and Build
        script: |
          # 1. فك ضغط الملف
          unzip -o lister-engine-simulator.zip
          
          # 2. البحث عن المجلد الذي يحتوي على build.gradle.kts والدخول إليه
          PROJECT_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          
          # 3. بناء APK
          gradle assembleDebug --no-daemon
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
