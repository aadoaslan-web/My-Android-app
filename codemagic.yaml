workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Build APK Direct
        script: |
          # 1. فك الضغط
          unzip -o lister-engine-simulator.zip
          
          # 2. البحث عن مجلد المشروع والذهاب إليه
          TARGET_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          
          # 3. البناء مباشرة بأمر gradle السحابي بدون gradlew
          gradle assembleDebug --no-daemon
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
