workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Extract and Build
        script: |
          unzip -o lister-engine-simulator.zip
          gradle assembleDebug --stacktrace
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
