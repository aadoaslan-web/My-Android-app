workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Extract zip and build
        script: |
          # 1. فك الضغط في مجلد مؤقت
          unzip -o lister-engine-simulator.zip -d temp_app
          
          # 2. البحث عن مكان الملف الرئيسي للـ Gradle والذهاب إليه تلقائياً
          TARGET_DIR=$(find temp_app -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          
          # 3. البناء مباشرة
          gradle assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
