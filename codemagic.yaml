workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Extract and Build APK
        script: |
          unzip -o lister-engine-simulator.zip
          gradle assembleDebug --no-daemon
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
