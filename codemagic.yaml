workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Extract and Generate Wrapper
        script: |
          # 1. فك ضغط الملف
          unzip -o lister-engine-simulator.zip
          
          # 2. تحديد المجلد الرئيسي للبناء
          TARGET_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          
          # 3. إنشاء مجلد Wrapper ملفات النظام يدوياً بالنسخة المستقرة 8.2
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 4. البناء الآن بأمان
          gradle assembleDebug --no-daemon
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
