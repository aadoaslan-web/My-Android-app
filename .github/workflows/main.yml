name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: unzip -o lister-engine-simulator.zip

    - name: Bypass KSP Crash and Build APK
      run: |
        TARGET_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
        cd "$TARGET_DIR"
        
        # تعطيل خاصية كاش KSP لمنع التضارب
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
        echo "ksp.incremental=false" >> gradle.properties
        
        # البناء بدون الخيارات المتصارعة
        gradle assembleDebug --no-daemon -x test
      env:
        JAVA_OPTS: "-Dksp.incremental=false"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/**/*.apk"
