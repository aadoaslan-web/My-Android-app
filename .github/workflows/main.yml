name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: unzip -o lister-engine-simulator.zip

    - name: Setup Gradle Wrapper & Build
      run: |
        TARGET_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
        cd "$TARGET_DIR"

        # إنشاء Wrapper يدوي لضمان توافق البيئة
        gradle wrapper --gradle-version 8.1.1

        # تنظيف البناء القديم ثم التجميع
        ./gradlew clean assembleDebug --no-daemon --stacktrace
      env:
        JAVA_HOME: $JAVA_HOME_17_X64

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/**/*.apk"
