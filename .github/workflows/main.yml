name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Move Files Automatically
      run: |
        # 1. فك ضغط الملف بالكامل مع كافة المجلدات والملفات الفرعية
        unzip -o lister-engine-simulator.zip -d extracted_project
        
        # 2. البحث عن المجلد الذي يحتوي على build.gradle أو build.gradle.kts
        TARGET_DIR=$(find extracted_project -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
        
        # 3. نقل كافة المحتويات إلى المجلد الرئيسي للمستودع
        cp -r $TARGET_DIR/* .
        
        # 4. تجهيز صلاحديات التشغيل والـ Wrapper
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon -x test -x lint

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/**/*.apk"
