name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Project & Build
      run: |
        # 1. فك ضغط الملف
        unzip -o lister-engine-simulator.zip -d extracted_project
        TARGET_DIR=$(find extracted_project -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
        
        # 2. نقل الملفات
        shopt -s dotglob
        cp -r $TARGET_DIR/* .
        
        # 3. إنشاء الملفات والمفاتيح المفقودة
        touch .env || true
        touch app/.env || true
        touch app/.env.example || true
        mkdir -p app ~/.android
        keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        cp app/debug.keystore ~/.android/debug.keystore || true
        
        # 4. التجميع مع إيقاف الـ Cache لتجنب خطأ الـ JAR
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --no-build-cache -x test -x lint

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/**/*.apk"
