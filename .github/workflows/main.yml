name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Project & Keystore & Build
      run: |
        # 1. فك ضغط الملف وتحديد مجلد المشروع
        unzip -o lister-engine-simulator.zip -d extracted_project
        TARGET_DIR=$(find extracted_project -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
        
        # 2. نقل جميع الملفات للجذر
        cp -r $TARGET_DIR/* .
        
        # 3. إنشاء مفتاح debug.keystore المفقود تلقائياً في كل الأماكن المحتملة
        mkdir -p app
        mkdir -p ~/.android
        keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        cp app/debug.keystore ~/.android/debug.keystore || true
        
        # 4. بناء الـ Wrapper وتشغيل التجميع
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon -x test -x lint -Dksp.incremental=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/**/*.apk"
